# Fork-only: release T3 Code (Joe) when main changes or pingdotgg/t3code publishes a
# stable release. Upstream X.Y.Z builds as X.Y.(Z*1000+100+n), so every release is
# newer than the last and installed apps update from these releases (the feed comes
# from GITHUB_REPOSITORY). packages/shared/src/forkVersion.ts maps it back for
# runtime downloads.
name: Fork release

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Release even if main hasn't changed since the last release
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  UPSTREAM: pingdotgg/t3code
  # Upstream workflows target infrastructure this fork doesn't have; keep them off.
  KEEP_WORKFLOW: .github/workflows/fork-release.yml

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - name: Disable upstream workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows" --paginate \
            --jq ".workflows[] | select(.state == \"active\" and .path != \"$KEEP_WORKFLOW\") | .id" |
            while read -r id; do gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$id/disable"; done

      - name: Decide whether to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          tag="$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          tag_sha="$(gh api "repos/$UPSTREAM/commits/$tag" --jq .sha)"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          # Fork networks share objects, so upstream SHAs resolve here. Unknown means merge.
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$tag_sha...$main_sha" --jq .status 2>/dev/null || echo unknown)"
          last_tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          last_sha=""
          if [[ -n "$last_tag" ]]; then
            last_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$last_tag" --jq .sha 2>/dev/null || true)"
          fi
          echo "upstream $tag ($status vs main); main $main_sha; last release $last_tag ($last_sha)"
          if [[ "$FORCE" != "true" && ( "$status" == "ahead" || "$status" == "identical" ) && "$main_sha" == "$last_sha" ]]; then
            echo "Nothing new since $last_tag."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - name: Check secrets
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in FORK_SYNC_TOKEN CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          # An unsigned build can't update installed apps, so never publish one.
          if (( ${#missing[@]} )); then
            echo "::error::Missing secrets or variables: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Merge upstream release
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags "https://github.com/$UPSTREAM.git" "refs/tags/$TAG:refs/tags/upstream/$TAG"
          if git merge --no-edit -m "Merge upstream $TAG" "upstream/$TAG"; then exit 0; fi
          # Only a measured number; upstream's value is fine for a build.
          budget=apps/server/src/provider/agentContextBudget.json
          if git diff --name-only --diff-filter=U | grep -qx "$budget"; then
            git checkout --theirs "$budget" && git add "$budget"
          fi
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [[ -z "$conflicts" ]]; then
            git commit --no-edit
            exit 0
          fi
          git merge --abort
          {
            echo "blocked=true"
            echo "reason<<EOF"
            echo "Merging \`$TAG\` into \`main\` conflicts in:"
            echo
            echo "$conflicts" | sed 's/^/- `/; s/$/`/'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-ci-deps
        if: steps.merge.outputs.blocked != 'true'

      - name: Check fork features
        id: verify
        if: steps.merge.outputs.blocked != 'true'
        run: |
          set -o pipefail
          run() { echo "::group::$*"; "$@" 2>&1 | tee -a "$RUNNER_TEMP/verify.log"; local s=$?; echo "::endgroup::"; return $s; }
          ok=true
          run vp run typecheck || ok=false
          (cd apps/server && run vp test run src/relay src/orchestration-v2 -t "mute|Mute") || ok=false
          (cd packages/client-runtime && run vp test run src/state -t "mute|Mute") || ok=false
          (cd apps/web && run vp test run --project unit src/hooks src/components -t "mute|Mute") || ok=false
          (cd apps/web && run vp test run --project unit src/components/Sidebar.automations.test.ts src/components/Sidebar.logic.test.ts src/components/Sidebar.drag.test.ts src/components/sidebar/automationTasksAtom.test.ts) || ok=false
          (cd packages/shared && run vp test run src/cliRelease.test.ts) || ok=false
          if [[ "$ok" != true ]]; then
            {
              echo "blocked=true"
              echo "reason<<EOF"
              echo "The merged code fails typecheck or the fork's tests. Last output:"
              echo
              echo '```'
              tail -n 60 "$RUNNER_TEMP/verify.log"
              echo '```'
              echo EOF
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Choose version
        id: version
        if: steps.merge.outputs.blocked != 'true' && steps.verify.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IFS=. read -r major minor patch <<< "${TAG#v}"
          first=$((patch * 1000 + 100))
          last=$((first + 899))
          highest="$(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' |
            sed -nE "s/^v$major\\.$minor\\.([0-9]+)\$/\\1/p" |
            awk -v lo="$first" -v hi="$last" '$1 >= lo && $1 <= hi' | sort -n | tail -n 1)"
          next=$(( ${highest:-$((first - 1))} + 1 ))
          if (( next > last )); then
            echo "::error::No fork versions left for upstream $TAG"
            exit 1
          fi
          echo "version=$major.$minor.$next" >> "$GITHUB_OUTPUT"
          echo "Releasing $major.$minor.$next (upstream $TAG)"

      - name: Push main
        if: steps.merge.outputs.blocked != 'true' && steps.verify.outputs.blocked != 'true'
        run: git push origin HEAD:main

      - name: Build signed macOS app
        if: steps.merge.outputs.blocked != 'true' && steps.verify.outputs.blocked != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          # Optional public T3 Connect config so new installs can sign in.
          T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
          T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
        run: |
          rustup target add aarch64-apple-darwin
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
          rm -rf release
          node scripts/build-desktop-artifact.ts \
            --platform mac --target dmg --arch arm64 --build-version "$VERSION" --signed
          rm -f "$APPLE_API_KEY"

      - name: Publish release
        if: steps.merge.outputs.blocked != 'true' && steps.verify.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A leftover tag would make the release point at its commit instead of ours.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v$VERSION" 2>/dev/null || true
          gh release create "v$VERSION" release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml \
            --target "$(git rev-parse HEAD)" \
            --title "T3 Code (Joe) $VERSION" \
            --notes "Based on upstream [$TAG](https://github.com/$UPSTREAM/releases/tag/$TAG), plus the fork's changes on \`main\` at $(git rev-parse --short HEAD). macOS Apple Silicon. Install the .dmg once; later versions arrive through the app's updater."
          gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"Fork sync blocked\" in:title" --json number --jq '.[].number' |
            while read -r n; do gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "Released v$VERSION."; done

      - name: Report blocked sync
        if: steps.merge.outputs.blocked == 'true' || steps.verify.outputs.blocked == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.merge.outputs.reason }}${{ steps.verify.outputs.reason }}
        run: |
          title="Fork sync blocked: $TAG"
          existing="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            body="$REASON"$'\n\n'"Resolve it locally (merge \`$TAG\` into \`main\` and push), then run the Fork release workflow again. Nothing was released; installed apps are unchanged."
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
          echo "::warning::$title (issue opened; later runs retry quietly)"
