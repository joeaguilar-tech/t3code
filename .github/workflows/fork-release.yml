# Fork-only: release when main differs from the last release or a manual
# run requests a forced release. Upstream syncs happen outside this workflow. A manual
# run can optionally merge upstream_ref before releasing. Versions follow the latest
# upstream release: upstream X.Y.Z builds as X.Y.(Z*1000+100+n), so every release is
# newer than the last and installed apps update from these releases (the feed comes
# from GITHUB_REPOSITORY).
# packages/shared/src/forkVersion.ts maps it back for runtime downloads.
name: Fork release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Release even if main hasn't changed since the last release
        type: boolean
        default: false
      upstream_ref:
        description: Optional upstream ref to merge into main before releasing
        type: string
        default: ""

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  UPSTREAM: pingdotgg/t3code
  # Upstream workflows target infrastructure this fork doesn't have; keep them off.
  KEEP_WORKFLOW: .github/workflows/fork-release.yml

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - name: Disable upstream workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows" --paginate \
            --jq ".workflows[] | select(.state == \"active\" and .path != \"$KEEP_WORKFLOW\") | .id" |
            while read -r id; do gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$id/disable"; done

      - name: Decide whether to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          INPUT_UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          tag="$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          merge_needed=false
          if [[ -n "$INPUT_UPSTREAM_REF" ]]; then
            upstream_sha="$(gh api "repos/$UPSTREAM/commits/$INPUT_UPSTREAM_REF" --jq .sha)"
            # Fork networks share objects, so upstream SHAs resolve here. Unknown means merge.
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$upstream_sha...$main_sha" --jq .status 2>/dev/null || echo unknown)"
            echo "upstream $INPUT_UPSTREAM_REF ($status vs main)"
            if [[ "$status" != "ahead" && "$status" != "identical" ]]; then
              merge_needed=true
            fi
          fi
          last_tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          last_sha=""
          if [[ -n "$last_tag" ]]; then
            last_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$last_tag" --jq .sha 2>/dev/null || true)"
          fi
          echo "main $main_sha; last release $last_tag ($last_sha)"
          if [[ "$FORCE" != "true" && "$merge_needed" == "false" && "$main_sha" == "$last_sha" ]]; then
            echo "Nothing new since $last_tag."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.skip != 'true'
    # GitHub-hosted Apple Silicon runners stopped picking up this job; it builds on the owner's Mac.
    runs-on: [self-hosted, macOS, ARM64, t3-release]
    timeout-minutes: 120
    env:
      TAG: ${{ needs.check.outputs.tag }}
      UPSTREAM_REF: ${{ inputs.upstream_ref }}
    steps:
      - name: Check secrets
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in FORK_SYNC_TOKEN CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          # An unsigned build can't update installed apps, so never publish one.
          if (( ${#missing[@]} )); then
            echo "::error::Missing secrets or variables: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Merge upstream
        id: merge
        if: env.UPSTREAM_REF != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags "https://github.com/$UPSTREAM.git" "$UPSTREAM_REF:refs/remotes/upstream/$UPSTREAM_REF"
          before="$(git rev-parse HEAD)"
          if git merge --no-edit -m "Merge upstream $UPSTREAM_REF" "upstream/$UPSTREAM_REF"; then
            if [[ "$(git rev-parse HEAD)" != "$before" ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          git rev-parse --verify MERGE_HEAD >/dev/null
          # Upstream's measured budget omits the fork's MCP tools, so the gate's
          # AgentContextBudget test fails until someone re-records the measured values.
          budget=apps/server/src/provider/agentContextBudget.json
          if git diff --name-only --diff-filter=U | grep -qx "$budget"; then
            git checkout --theirs "$budget"
            git add "$budget"
          fi
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [[ -z "$conflicts" ]]; then
            git commit --no-edit
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --abort
          {
            echo "blocked=true"
            echo "reason<<EOF"
            echo "Merging upstream \`$UPSTREAM_REF\` into \`main\` conflicts in:"
            echo
            echo "$conflicts" | sed 's/^/- `/; s/$/`/'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # The shared setup restores a Vite+ cache built under GitHub's runner home, which
      # does not exist on this self-hosted Mac; its pnpm store persists locally instead.
      - name: Setup Vite+
        if: steps.merge.outputs.blocked != 'true'
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        env:
          VP_DOWNLOAD_TIMEOUT: "120"
        with:
          node-version-file: package.json
          cache: false

      - name: Install dependencies
        if: steps.merge.outputs.blocked != 'true'
        run: vp install

      - name: Check fork features
        id: verify
        if: steps.merge.outputs.blocked != 'true'
        env:
          MERGE_CHANGED: ${{ steps.merge.outputs.changed }}
        run: |
          set -o pipefail
          run() {
            echo "::group::$*"
            (
              for arg in "$@"; do
                if [[ ( "$arg" == *.test.ts || "$arg" == *.test.tsx ) && ! -f "$arg" ]] ||
                  [[ "$arg" == src/* && "$arg" != *.* && ! -d "$arg" ]]; then
                  echo "::error::Missing test path: $arg"
                  exit 1
                fi
              done
              "$@"
            ) 2>&1 | tee -a "$RUNNER_TEMP/verify.log"
            local s=$?
            echo "::endgroup::"
            return "$s"
          }
          ok=true
          (cd packages/shared && run vp test run src/forkBrand.test.ts) || ok=false
          (cd apps/desktop && run vp test run src/app/DesktopAppIdentity.test.ts) || ok=false
          (cd apps/web && run vp test run --project unit src/branding.logic.test.ts) || ok=false
          run vp test run scripts/build-desktop-artifact.test.ts -t "while preserving update identity" || ok=false
          run vp test run scripts/apply-web-brand-assets.test.ts || ok=false
          run vp run typecheck || ok=false
          (cd apps/server && run vp test run src/relay src/orchestration-v2 -t "mute|Mute") || ok=false
          (cd packages/client-runtime && run vp test run src/state -t "mute|Mute") || ok=false
          (cd apps/web && run vp test run --project unit src/hooks src/components -t "mute|Mute") || ok=false
          (cd apps/web && run vp test run --project unit src/components/Sidebar.logic.test.ts src/components/Sidebar.drag.test.ts) || ok=false
          (cd packages/client-runtime && run vp test run src/state/automationThreads.test.ts) || ok=false
          (cd packages/shared && run vp test run src/cliRelease.test.ts) || ok=false
          (cd packages/shared && run vp test run src/spokenReply.test.ts src/composerContextReferences.test.ts) || ok=false
          (cd packages/contracts && run vp test run src/composerContext.test.ts src/keybindings.test.ts) || ok=false
          (cd packages/client-runtime && run vp test run \
            src/voice-input/controller.test.ts \
            src/voice-input/environment.test.ts \
            src/voice-input/stream.test.ts \
            src/voice-input/voiceMode.test.ts) || ok=false
          (cd apps/mobile && run vp test run \
            app.config.test.ts \
            src/components/brandAssets.test.ts \
            src/features/voice-input/VoiceInputProvider.test.ts \
            src/features/voice-input/environmentTranscriber.test.ts \
            src/features/voice-input/lazyVoiceRecorder.test.ts \
            src/features/voice-input/voiceDestination.test.ts \
            src/features/voice-input/voiceInputSession.test.ts \
            src/features/voice-input/voiceRecordingPermission.test.ts \
            src/features/voice-mode/quietDetector.test.ts \
            src/features/voice-mode/speech.test.ts \
            src/features/voice-mode/threadVoiceMode.test.ts) || ok=false
          (cd apps/server && run vp test run src/orchestration-v2/ProviderTurnStartService.test.ts) || ok=false
          (cd apps/server && run vp test run src/orchestration-v2/ProviderTurnControlService.test.ts) || ok=false
          (cd apps/web && run vp test run --project unit \
            src/components/Sidebar.environment.test.ts \
            src/hooks/useHandleNewThread.test.ts \
            src/keybindings.test.ts \
            src/shortcuts/chatRouteCommands.test.ts \
            src/uiStateStore.test.ts) || ok=false
          (cd apps/server && run vp test run src/keybindings.test.ts src/provider/AgentContextBudget.test.ts) || ok=false
          if [[ "$ok" != true ]]; then
            if [[ "$MERGE_CHANGED" != true ]]; then
              echo "::error::Main fails typecheck or the fork's tests."
              exit 1
            fi
            {
              echo "blocked=true"
              echo "reason<<EOF"
              echo "The merged code fails typecheck or the fork's tests. Last output:"
              echo
              echo '```'
              tail -n 60 "$RUNNER_TEMP/verify.log"
              echo '```'
              echo EOF
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Choose version
        id: version
        if: steps.merge.outputs.blocked != 'true' && steps.verify.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IFS=. read -r major minor patch <<< "${TAG#v}"
          first=$((patch * 1000 + 100))
          last=$((first + 899))
          highest="$(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' |
            sed -nE "s/^v$major\\.$minor\\.([0-9]+)\$/\\1/p" |
            awk -v lo="$first" -v hi="$last" '$1 >= lo && $1 <= hi' | sort -n | tail -n 1)"
          next=$(( ${highest:-$((first - 1))} + 1 ))
          if (( next > last )); then
            echo "::error::No fork versions left for upstream $TAG"
            exit 1
          fi
          echo "version=$major.$minor.$next" >> "$GITHUB_OUTPUT"
          echo "Releasing $major.$minor.$next (upstream $TAG)"

      - name: Push main
        if: steps.merge.outputs.changed == 'true' && steps.verify.outputs.blocked != 'true'
        run: git push origin HEAD:main

      - name: Build signed macOS app
        if: steps.merge.outputs.blocked != 'true' && steps.verify.outputs.blocked != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          T3CODE_BRAND: j3
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          # Optional public T3 Connect config so new installs can sign in.
          T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
          T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
        run: |
          rustup target add aarch64-apple-darwin
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
          # This Mac's endpoint security (Kandji) breaks `hdiutil convert`, which the DMG
          # builder needs, and makes `hdiutil create` flaky. Updates only need the zip, so
          # the installer DMG is best-effort.
          rm -rf release
          node scripts/build-desktop-artifact.ts \
            --platform mac --target zip --arch arm64 --build-version "$VERSION" --signed
          stage="$RUNNER_TEMP/dmg-stage"
          rm -rf "$stage" && mkdir -p "$stage"
          ditto -x -k release/*.zip "$stage"
          # electron-builder silently skips signing when it finds no trusted identity (e.g. the
          # Developer ID G2 intermediate is missing), and installed apps then reject the update.
          app=$(echo "$stage"/*.app)
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -qx "TeamIdentifier=$APPLE_TEAM_ID" ||
            { echo "::error::Release app is not signed by team $APPLE_TEAM_ID."; exit 1; }
          ln -s /Applications "$stage/Applications"
          brand_name="$(node scripts/fork/brand-field.ts name)"
          for attempt in 1 2 3; do
            hdiutil create -volname "$brand_name $VERSION" -srcfolder "$stage" \
              -format UDZO -ov "release/T3-Code-$VERSION-arm64.dmg" && break
            rm -f "release/T3-Code-$VERSION-arm64.dmg"
            (( attempt < 3 )) || echo "::warning::No installer DMG this release; updates use the zip."
            sleep 10
          done
          rm -rf "$stage"
          rm -f "$APPLE_API_KEY"

      - name: Publish release
        if: steps.merge.outputs.blocked != 'true' && steps.verify.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          T3CODE_BRAND: j3
        run: |
          # A leftover tag would make the release point at its commit instead of ours.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v$VERSION" 2>/dev/null || true
          shopt -s nullglob
          upstream_release="latest upstream release [$TAG](https://github.com/$UPSTREAM/releases/tag/$TAG)"
          upstream_note="Version follows the $upstream_release."
          if [[ -n "$UPSTREAM_REF" ]]; then
            upstream_note="Based on upstream \`$UPSTREAM_REF\` at $(git rev-parse --short "upstream/$UPSTREAM_REF") ($upstream_release), plus the fork's changes."
          fi
          brand_name="$(node scripts/fork/brand-field.ts name)"
          brand_statement="$(node scripts/fork/brand-field.ts statement)"
          gh release create "v$VERSION" release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml \
            --target "$(git rev-parse HEAD)" \
            --title "$brand_name $VERSION" \
            --notes "$brand_statement"$'\n\n'"$upstream_note Released from \`main\` at $(git rev-parse --short HEAD). macOS Apple Silicon. Install once from the .dmg (or the .zip if no .dmg is attached); later versions arrive through the app's updater."

      # The sync token cannot comment on issues; the job token can.
      - name: Close blocked-sync issues
        if: steps.merge.outputs.blocked != 'true' && steps.verify.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"Fork sync blocked\" in:title" --json number --jq '.[].number' |
            while read -r n; do gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "Released v$VERSION."; done

      - name: Report blocked sync
        if: steps.merge.outputs.blocked == 'true' || steps.verify.outputs.blocked == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.merge.outputs.reason }}${{ steps.verify.outputs.reason }}
        run: |
          title="Fork sync blocked: upstream $UPSTREAM_REF"
          existing="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            body="$REASON"$'\n\n'"Resolve it locally (merge upstream \`$UPSTREAM_REF\` into \`main\` and push), then run the Fork release workflow again. Nothing was released; installed apps are unchanged."
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
          echo "::warning::$title (issue opened; later runs retry quietly)"
